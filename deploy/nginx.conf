# Nginx reverse-proxy configuration for Scrappy / Firecrawl
#
# Prerequisites (Ubuntu):
#   sudo apt install nginx certbot python3-certbot-nginx
#
# Usage:
#   1. Replace "your-domain.example.com" with your real domain.
#   2. Copy this file to /etc/nginx/sites-available/scrappy
#   3. Enable it:  sudo ln -s /etc/nginx/sites-available/scrappy /etc/nginx/sites-enabled/
#   4. Test:       sudo nginx -t
#   5. Reload:     sudo systemctl reload nginx
#   6. Obtain TLS: sudo certbot --nginx -d your-domain.example.com
#      (Certbot will rewrite the server block to add SSL automatically.)

# --- HTTP → HTTPS redirect (Certbot manages this after step 6) ---
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (populated by Certbot; fill ssl_certificate paths manually if not using Certbot) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example.com;

    # TLS certificates — Certbot sets these automatically.
    # Uncomment and set paths manually if you manage certificates yourself:
    # ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"                   always;

    # Increase timeouts for long-running crawl/scrape jobs
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;
    proxy_connect_timeout 10s;

    # WebSocket support (used by the agent livecast endpoint)
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";

    # Pass real client IP to the app
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Forward all traffic to the Docker-exposed API port (default 3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}
